<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Group Link 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h2 { color: #075e54; margin-bottom: 10px; }
        p { color: #555; font-size: 14px; }
        .timer-box {
            font-size: 28px;
            font-weight: bold;
            color: #d9534f;
            margin: 15px 0;
        }
        .btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            width: 80%;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>WhatsApp Group Link</h2>
    <p>Please wait... Your group link is generating.</p>
    
    <!-- ٹائمر کاؤنٹر -->
    <div class="timer-box" id="timer">15</div>

    <!-- جوائن بٹن -->
    <button id="joinBtn" class="btn" disabled>Wait for Timer...</button>
</div>

<script>
    let timeLeft = 15;
    const timerElem = document.getElementById('timer');
    const joinBtn = document.getElementById('joinBtn');

    // آپ کا ایڈسٹیرا سمارٹ لنک
    const adsterraLink = "https://sixstale.com/f3efetw5?key=3ceb773fc9c7ca64b0cca412512cf6dc";
    
    // آپ کا واٹس ایپ گروپ لنک
    const whatsappLink = "Https://chat.whatsapp.com/Es4Yz8gBgQVCCPBpztFq1i?s=cl&p=a&mlu=4&ilr=4";

    // 15 سیکنڈ کا کاؤنٹ ڈاؤن ٹائمر
    const countdown = setInterval(() => {
        timeLeft--;
        timerElem.innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerElem.innerText = "Ready!";
            timerElem.style.color = "#25d366";
            
            // بٹن فعال کرنا
            joinBtn.removeAttribute('disabled');
            joinBtn.innerText = "Join WhatsApp Group Now";
        }
    }, 1000);

    // بٹن پر کلک کا عمل
    joinBtn.addEventListener('click', function() {
        // 1. Adsterra کا ایڈ نئے ٹیب میں کھلے گا
        window.open(adsterraLink, '_blank');
        
        // 2. اصل واٹس ایپ کا لنک اسی پیج پر کھل جائے گا
        window.location.href = whatsappLink;
    });
</script>

</body>
</html>
