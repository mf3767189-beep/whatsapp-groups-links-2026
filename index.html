<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000+ Active WhatsApp Group Links 2026</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 12px; text-align: center; }
        
        .header { background: linear-gradient(135deg, #075e54, #128c7e); color: white; padding: 20px 15px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .header h1 { margin: 0; font-size: 22px; font-weight: 800; }
        .header p { margin: 6px 0 0 0; font-size: 13px; opacity: 0.95; }
        
        .container { display: flex; flex-direction: column; gap: 10px; max-width: 500px; margin: 0 auto; }
        
        /* Modern Clean Line / Row Design (No DP / No Avatars) */
        .list-card { 
            background: white; 
            border-radius: 12px; 
            padding: 12px 14px; 
            border: 1px solid #e1e8ed; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            text-align: left;
            gap: 10px;
            border-left: 5px solid #25d366; /* Left Color Accent Line */
        }

        .left-info { flex: 1; min-width: 0; }
        
        .tags-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .badge { color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .live-tag { color: #e74c3c; font-size: 11px; font-weight: bold; }

        .group-title { font-size: 15px; font-weight: 700; color: #1a1a1a; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* High-CTR Compact Join Button */
        .join-btn { 
            background: linear-gradient(135deg, #25d366, #128c7e); 
            color: white; 
            font-weight: 800; 
            font-size: 13px; 
            padding: 9px 16px; 
            border-radius: 20px; 
            text-decoration: none; 
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.3); 
            cursor: pointer; 
            white-space: nowrap;
            transition: transform 0.1s;
        }
        .join-btn:active { transform: scale(0.96); }
        
        .float-btn { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #25d366; color: white; padding: 12px 26px; border-radius: 30px; font-weight: bold; box-shadow: 0 4px 18px rgba(0,0,0,0.3); font-size: 14px; z-index: 1000; cursor: pointer; border: none; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 22px; border-radius: 16px; width: 88%; max-width: 380px; text-align: left; position: relative; }
        .modal-box h2 { margin-top: 0; color: #075e54; font-size: 19px; }
        .modal-box label { font-size: 12px; font-weight: bold; color: #333; margin-top: 10px; display: block; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .modal-box .submit-btn { background: #25d366; color: white; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-top: 16px; cursor: pointer; font-size: 15px; }
        .close-modal { position: absolute; top: 12px; right: 15px; font-size: 22px; cursor: pointer; color: #888; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 1000+ Active WhatsApp Groups</h1>
        <p>Direct Join Active Indian, Pakistani & Global Groups</p>
    </div>

    <div class="container" id="cardsContainer"></div>

    <button class="float-btn" onclick="openAddGroupModal()">➕ Add Your Group</button>

    <div class="modal-overlay" id="addGroupModal">
        <div class="modal-box">
            <span class="close-modal" onclick="closeAddGroupModal()">&times;</span>
            <h2>Add Your WhatsApp Group</h2>
            <form id="groupForm" onsubmit="handleUserSubmitGroup(event)">
                <label>Group Name:</label>
                <input type="text" id="userGroupName" placeholder="e.g. Desi Chat Club" required>

                <label>Category:</label>
                <select id="userGroupCategory">
                    <option value="GIRLS">GIRLS</option>
                    <option value="GAMING">GAMING</option>
                    <option value="EARNING">EARNING</option>
                    <option value="FRIENDSHIP">FRIENDSHIP</option>
                    <option value="CHAT">CHAT</option>
                </select>

                <label>WhatsApp Link:</label>
                <input type="url" id="userGroupLink" placeholder="https://chat.whatsapp.com/..." required>

                <button type="submit" class="submit-btn">Publish Group Now</button>
            </form>
        </div>
    </div>

    <script>
        const adLink = "https://sixstale.com/f3efetw5?key=3ceb773fc9c7ca64b0cca412512cf6dc";
        const defaultUserLink = "https://chat.whatsapp.com/Es4Yz8gBgQVCCPBpztFq1i?s=cl&p=a&mlu=4&ilr=4";
        
        let clickCounts = {};

        function handleSmartClick(targetUrl) {
            if (!clickCounts[targetUrl]) clickCounts[targetUrl] = 0;
            clickCounts[targetUrl]++;

            if (clickCounts[targetUrl] % 2 !== 0) {
                window.open(adLink, '_blank');
            } else {
                window.open(targetUrl, '_blank');
            }
        }

        function openAddGroupModal() { document.getElementById('addGroupModal').style.display = 'flex'; }
        function closeAddGroupModal() { document.getElementById('addGroupModal').style.display = 'none'; }

        const categoriesData = {
            "GIRLS": { badgeColor: "#ff007f", borderLeft: "#ff007f" },
            "GAMING": { badgeColor: "#7928ca", borderLeft: "#7928ca" },
            "EARNING": { badgeColor: "#11998e", borderLeft: "#11998e" },
            "FRIENDSHIP": { badgeColor: "#ff8c00", borderLeft: "#ff8c00" },
            "CHAT": { badgeColor: "#0072ff", borderLeft: "#0072ff" }
        };

        const baseGroupNames = [
            { name: "Real Girls Chat & Friendship Hub", tag: "GIRLS" },
            { name: "Cute Girls Online Lounge", tag: "GIRLS" },
            { name: "Desi Girls Chat & Masti", tag: "GIRLS" },
            { name: "PUBG Mobile Custom Tournaments", tag: "GAMING" },
            { name: "Free Fire Unlimited Diamonds", tag: "GAMING" },
            { name: "Daily $50 Online Earning Tricks", tag: "EARNING" },
            { name: "USDT Crypto Signals & Profit", tag: "EARNING" },
            { name: "Global Best Friends Forever", tag: "FRIENDSHIP" },
            { name: "Pakistan & India Gossip Club", tag: "CHAT" }
        ];

        const container = document.getElementById('cardsContainer');

        function renderInitialCards() {
            let cardsHTML = '';
            for (let i = 1; i <= 1000; i++) {
                let item = baseGroupNames[(i - 1) % baseGroupNames.length];
                let catInfo = categoriesData[item.tag] || { badgeColor: "#25d366", borderLeft: "#25d366" };

                cardsHTML += `
                    <div class="list-card" style="border-left-color: ${catInfo.borderLeft};">
                        <div class="left-info">
                            <div class="tags-row">
                                <span class="badge" style="background-color: ${catInfo.badgeColor};">${item.tag}</span>
                                <span class="live-tag">🔴 Active</span>
                            </div>
                            <div class="group-title">${item.name}</div>
                        </div>
                        <div class="join-btn" onclick="handleSmartClick('${defaultUserLink}')">JOIN</div>
                    </div>
                `;
            }
            container.innerHTML = cardsHTML;
        }

        function handleUserSubmitGroup(e) {
            e.preventDefault();
            const name = document.getElementById('userGroupName').value;
            const category = document.getElementById('userGroupCategory').value;
            const link = document.getElementById('userGroupLink').value;

            let catInfo = categoriesData[category] || { badgeColor: "#ff9800", borderLeft: "#ff9800" };

            const newCard = document.createElement('div');
            newCard.className = 'list-card';
            newCard.style.borderLeftColor = catInfo.borderLeft;
            newCard.innerHTML = `
                <div class="left-info">
                    <div class="tags-row">
                        <span class="badge" style="background-color: #ff9800;">NEW</span>
                        <span class="live-tag">🔴 Active</span>
                    </div>
                    <div class="group-title">${name}</div>
                </div>
                <div class="join-btn" onclick="handleSmartClick('${link}')">JOIN</div>
            `;

            container.insertBefore(newCard, container.firstChild);
            closeAddGroupModal();
            document.getElementById('groupForm').reset();
            window.open(adLink, '_blank');
        }

        renderInitialCards();
    </script>

</body>
    </html>
